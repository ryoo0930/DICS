<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>DICS 설정</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 220px;
      font-family: 'Malgun Gothic', sans-serif;
      font-size: 13px;
      color: #333;
      background: #fff;
    }
    header {
      background: #4a6cf7;
      color: #fff;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: bold;
    }
    main { padding: 14px; }
    label {
      display: block;
      font-size: 11px;
      color: #666;
      margin-bottom: 5px;
    }
    .input-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    input[type="number"] {
      width: 80px;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
    }
    input[type="number"]:focus { border-color: #4a6cf7; }
    span.unit { font-size: 12px; color: #888; }
    #save-btn {
      width: 100%;
      margin-top: 12px;
      padding: 8px;
      background: #4a6cf7;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    #save-btn:hover { background: #3558e0; }
    #msg {
      margin-top: 8px;
      font-size: 12px;
      color: #2e7d32;
      text-align: center;
      min-height: 16px;
    }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #aaa;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>DICS 설정</header>
  <main>
    <label>최대 검색 페이지 수</label>
    <div class="input-row">
      <input type="number" id="max-pages" min="1" max="500" value="100" />
      <span class="unit">페이지</span>
    </div>
    <button id="save-btn">저장</button>
    <div id="msg"></div>
    <p class="hint">페이지당 약 0.3초 소요.<br>100페이지 ≈ 30초, 300페이지 ≈ 90초</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
